<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        /* ページ全体を中央揃え */
        html,body{
            height:100%;
            margin:0;
            font-family: system-ui,-apple-system, "Helvetica Neue", Arial;
            background:#f7fafc;
            color:#2d3748;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .container{
            text-align:center;
        }
        /* スピナー */
        .spinner{
            width:64px;
            height:64px;
            border-radius:50%;
            position:relative;
            margin:0 auto 16px;
            box-shadow: 0 0 0 6px rgba(66,153,225,0.12);
        }
        .spinner::before{
            content:"";
            box-sizing:border-box;
            position:absolute;
            inset:0;
            border-radius:50%;
            border:6px solid transparent;
            border-top-color:#3182ce; /* 青いリング */
            animation:spin 1s linear infinite;
        }
        @keyframes spin{
            from{ transform: rotate(0deg); }
            to  { transform: rotate(360deg); }
        }
        .msg{
            font-size:16px;
            color:#4a5568;
        }
        .link{
            display:block;
            margin-top:8px;
            color:#3182ce;
            text-decoration:none;
            font-size:14px;
            word-break:break-all;
        }
    </style>
    <script>
        (function(){
            var url = 'https://www.vrugd.jp/';
            // 3秒後に置換（history に残さない）
            setTimeout(function(){ location.replace(url); }, 3000);
        })();
    </script>
</head>
<body>
    <div class="container" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div class="msg">転送中…しばらくお待ちください</div>
        <a class="link" href="https://www.vrugd.jp/">https://www.vrugd.jp/</a>
    </div>
</body>
</html>
